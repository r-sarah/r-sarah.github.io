<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AeroGuide — Architecture RAG</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: max(1rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px))
        max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
      background: #050a14;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .ag-wrap {
      background: #0a1220;
      border-radius: 16px;
      padding: 28px 24px 24px;
      width: 100%;
      max-width: 680px;
      margin: auto 0;
    }

    @media (max-width: 480px) {
      .ag-wrap {
        padding: 18px 14px 16px;
        border-radius: 12px;
      }
    }

    .ag-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <div class="ag-wrap">
    <svg width="100%" viewBox="0 0 640 630" role="img" xmlns="http://www.w3.org/2000/svg">
      <title>Architecture RAG AeroGuide</title>
      <desc>Pipeline RAG : 4 sources officielles → Crawl4AI → Chunking → Embeddings → ChromaDB → Agent GPT-4o → Réponse utilisateur</desc>

      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ROW 1 — Sources officielles -->
      <text x="320" y="18" text-anchor="middle" class="ag-label" fill="#38bdf8" opacity="0.7">Sources officielles</text>

      <rect x="20"  y="26" width="138" height="48" rx="8" fill="#0e2236" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="89"  y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#7dd3fc">Diplomatie.gouv</text>
      <text x="89"  y="62" text-anchor="middle" font-size="10" fill="#38bdf8" opacity="0.55">Visas &amp; sécurité</text>

      <rect x="168" y="26" width="130" height="48" rx="8" fill="#0e2236" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="233" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#7dd3fc">Douane.gouv</text>
      <text x="233" y="62" text-anchor="middle" font-size="10" fill="#38bdf8" opacity="0.55">Règles douanières</text>

      <rect x="308" y="26" width="120" height="48" rx="8" fill="#0e2236" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="368" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#7dd3fc">Air France</text>
      <text x="368" y="62" text-anchor="middle" font-size="10" fill="#38bdf8" opacity="0.55">Bagages &amp; vols</text>

      <rect x="438" y="26" width="182" height="48" rx="8" fill="#0e2236" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="529" y="45" text-anchor="middle" font-size="12" font-weight="500" fill="#7dd3fc">Elsan Care</text>
      <text x="529" y="62" text-anchor="middle" font-size="10" fill="#38bdf8" opacity="0.55">Vaccins &amp; santé</text>

      <line x1="89"  y1="74" x2="89"  y2="112" stroke="#38bdf8" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>
      <line x1="233" y1="74" x2="233" y2="112" stroke="#38bdf8" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>
      <line x1="368" y1="74" x2="368" y2="112" stroke="#38bdf8" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>
      <line x1="529" y1="74" x2="529" y2="112" stroke="#38bdf8" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>

      <!-- ROW 2 — Scraping -->
      <rect x="20" y="112" width="600" height="50" rx="10" fill="#0d1f35" stroke="#38bdf8" stroke-width="1"/>
      <text x="320" y="133" text-anchor="middle" font-size="13" font-weight="500" fill="#7dd3fc">Scraping automatisé — Crawl4AI</text>
      <text x="320" y="151" text-anchor="middle" font-size="10" fill="#38bdf8" opacity="0.55">Extraction &amp; nettoyage du contenu web</text>

      <line x1="320" y1="162" x2="320" y2="196" stroke="#38bdf8" stroke-width="1" marker-end="url(#arr)" opacity="0.5"/>

      <!-- ROW 3 — Chunking -->
      <rect x="20" y="196" width="600" height="50" rx="10" fill="#1a1040" stroke="#818cf8" stroke-width="1"/>
      <text x="320" y="217" text-anchor="middle" font-size="13" font-weight="500" fill="#a5b4fc">Découpage en chunks — LangChain</text>
      <text x="320" y="235" text-anchor="middle" font-size="10" fill="#818cf8" opacity="0.6">Segmentation sémantique du texte</text>

      <line x1="320" y1="246" x2="320" y2="278" stroke="#818cf8" stroke-width="1" marker-end="url(#arr2)" opacity="0.5"/>

      <!-- ROW 4 — Embeddings -->
      <text x="320" y="272" text-anchor="middle" class="ag-label" fill="#818cf8" opacity="0.7">Vectorisation</text>

      <rect x="20"  y="280" width="288" height="50" rx="10" fill="#1a1040" stroke="#818cf8" stroke-width="0.8"/>
      <text x="164" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#a5b4fc">OpenAI Embeddings</text>
      <text x="164" y="318" text-anchor="middle" font-size="10" fill="#818cf8" opacity="0.6">text-embedding-3-large</text>

      <rect x="332" y="280" width="288" height="50" rx="10" fill="#1a1040" stroke="#818cf8" stroke-width="0.8"/>
      <text x="476" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#a5b4fc">HuggingFace Embeddings</text>
      <text x="476" y="318" text-anchor="middle" font-size="10" fill="#818cf8" opacity="0.6">all-MiniLM-L6-v2</text>

      <line x1="164" y1="330" x2="164" y2="362" stroke="#818cf8" stroke-width="1" marker-end="url(#arr2)" opacity="0.5"/>
      <line x1="476" y1="330" x2="476" y2="362" stroke="#818cf8" stroke-width="1" marker-end="url(#arr2)" opacity="0.5"/>

      <!-- ROW 5 — Vector Stores -->
      <text x="320" y="358" text-anchor="middle" class="ag-label" fill="#818cf8" opacity="0.7">Vector Stores — ChromaDB</text>

      <rect x="20"  y="366" width="288" height="50" rx="10" fill="#1a1040" stroke="#818cf8" stroke-width="0.8"/>
      <text x="164" y="386" text-anchor="middle" font-size="12" font-weight="500" fill="#a5b4fc">Collection Air France</text>
      <text x="164" y="404" text-anchor="middle" font-size="10" fill="#818cf8" opacity="0.6">infos_douanes_airfrance</text>

      <rect x="332" y="366" width="288" height="50" rx="10" fill="#1a1040" stroke="#818cf8" stroke-width="0.8"/>
      <text x="476" y="386" text-anchor="middle" font-size="12" font-weight="500" fill="#a5b4fc">Collection Conseils</text>
      <text x="476" y="404" text-anchor="middle" font-size="10" fill="#818cf8" opacity="0.6">conseils_voyageurs</text>

      <path d="M164 416 L164 448 L320 448 L320 464" fill="none" stroke="#c084fc" stroke-width="1" marker-end="url(#arr3)" opacity="0.55"/>
      <path d="M476 416 L476 448 L320 448" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.55"/>

      <!-- ROW 6 — Agent IA -->
      <rect x="20" y="464" width="600" height="56" rx="10" fill="#200d3a" stroke="#c084fc" stroke-width="1.2"/>
      <text x="320" y="486" text-anchor="middle" font-size="13" font-weight="500" fill="#d8b4fe">Agent IA — LangChain + GPT-4o</text>
      <text x="320" y="506" text-anchor="middle" font-size="10" fill="#c084fc" opacity="0.65">Recherche MMR · Mémoire persistante · Raisonnement croisé</text>

      <line x1="320" y1="520" x2="320" y2="552" stroke="#c084fc" stroke-width="1" marker-end="url(#arr3)" opacity="0.55"/>

      <!-- ROW 7 — Réponse -->
      <rect x="20" y="552" width="600" height="48" rx="10" fill="#0d2e1a" stroke="#34d399" stroke-width="1"/>
      <text x="320" y="571" text-anchor="middle" font-size="13" font-weight="500" fill="#6ee7b7">Réponse fiable à l'utilisateur</text>
      <text x="320" y="589" text-anchor="middle" font-size="10" fill="#34d399" opacity="0.6">Visas · Bagages · Douane · Santé · Conseils voyage</text>
    </svg>
  </div>
</body>
</html>
